name: cd

on:
  push:
    branches: [main]

jobs:
  deploy: 
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
    
      - name: Node
        uses: actions/setup-node@v5
        with: 
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      
      - name: Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        id: auth

      - name: Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-505114/notely-ar-repo/notely:latest .