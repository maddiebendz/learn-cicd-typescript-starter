name: assignment

on:
  push:
    branches: [main]

jobs:
  deploy: 
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
    
      - name: Node
        uses: actions/setup-node@v5
        with: 
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
